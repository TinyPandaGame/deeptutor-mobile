name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: node scripts/source-check.mjs
      - run: node scripts/source-check.mjs --history
  upstream-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upstream: ['1.7.1', '1.7.2']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "deeptutor[server,providers,reading]==${{ matrix.upstream }}" httpx python-multipart
      - name: Check upstream contracts
        env:
          TEST_SCRATCH: ${{ runner.temp }}
        run: |
          python server/tests/test_mobile_models.py
          python server/tests/test_upstream_contracts.py
